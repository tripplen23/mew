run_id: golden-task-1-wc-20260728-85b451e
scope_mode: language_port
units:
  - id: inspect-baseline
    order: 1
    description: "Read tests/fixtures/wc.py and document its behavior surface"
    depends_on: []
    target_paths:
      - tests/fixtures/wc.py
    verification: "python3 -c 'import sys; sys.path.insert(0,\"tests/fixtures\"); from wc import wc; assert wc(\"test\") == {\"words\":1,\"lines\":1,\"chars\":4,\"bytes\":4}'"

  - id: write-rust-lib
    order: 2
    description: "Implement wc() in mew-core/crates/engine/src/migration/wc.rs"
    depends_on: [inspect-baseline]
    target_paths:
      - mew-core/crates/engine/src/migration/wc.rs
    verification: "cargo check -p mewcode-engine"

  - id: register-module
    order: 3
    description: "Register migration module in engine/src/lib.rs"
    depends_on: [write-rust-lib]
    target_paths:
      - mew-core/crates/engine/src/lib.rs
    verification: "cargo check -p mewcode-engine"

  - id: add-tests
    order: 4
    description: "Add integration tests matching every Python baseline case"
    depends_on: [write-rust-lib, register-module]
    target_paths:
      - mew-core/crates/engine/tests/wc.rs
    verification: "cargo test -p mewcode-engine --test wc"

  - id: parity-verification
    order: 5
    description: "Run all wc tests and produce parity-report.json"
    depends_on: [add-tests]
    verification: "cargo test -p mewcode-engine --test wc && cargo doc --workspace --no-deps -D warnings"
    target_paths: []
